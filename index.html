<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木虾物流 - 智能运费查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .form-group label .required {
            color: #e74c3c;
        }
        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .results-table th,
        .results-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        .results-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
            cursor: pointer;
        }
        .results-table th:hover {
            background: #e9ecef;
        }
        .results-table tr:hover {
            background: #f8f9fa;
        }
        .price {
            font-size: 1.2em;
            font-weight: 700;
            color: #27ae60;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .badge-express { background: #e3f2fd; color: #1976d2; }
        .badge-air { background: #e8f5e9; color: #388e3c; }
        .badge-sea { background: #fff3e0; color: #f57c00; }
        .badge-line { background: #f3e5f5; color: #7b1fa2; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        .tooltip {
            position: relative;
            cursor: help;
        }
        .tooltip:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            white-space: nowrap;
            z-index: 100;
        }
        .admin-link {
            display: inline-block;
            margin-top: 10px;
            color: #667eea;
            text-decoration: none;
        }
        .admin-link:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🦐 木虾物流</h1>
            <p>智能运费查询系统 - 10 秒完成多渠道运费核算</p>
        </header>

        <!-- 查询表单 -->
        <div class="card">
            <h2>🔍 运费查询</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>目的国 <span class="required">*</span></label>
                    <select id="country">
                        <option value="">请选择国家</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>重量 (kg) <span class="required">*</span></label>
                    <input type="number" id="weight" step="0.01" min="0.01" placeholder="请输入重量">
                </div>
                <div class="form-group">
                    <label>服务商类型</label>
                    <select id="serviceType">
                        <option value="">全部</option>
                        <option value="快递">快递</option>
                        <option value="空运">空运</option>
                        <option value="海运">海运</option>
                        <option value="专线">专线</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>货物类型</label>
                    <select id="cargoType">
                        <option value="">全部</option>
                        <option value="普货">普货</option>
                        <option value="带电">带电</option>
                        <option value="带磁">带磁</option>
                        <option value="敏感货">敏感货</option>
                    </select>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="searchFreight()">🔍 搜索运费</button>
                <button class="btn btn-secondary" onclick="resetForm()">🔄 重置</button>
            </div>
        </div>

        <!-- 查询结果 -->
        <div class="card">
            <h2>📊 查询结果</h2>
            <div id="results">
                <div class="empty-state">
                    <div class="icon">📦</div>
                    <p>请输入查询条件，点击搜索查看运费报价</p>
                </div>
            </div>
        </div>

        <footer>
            <p>© 2026 木虾物流服务平台 | Powered by OpenClaw</p>
        </footer>
    </div>

    <script src="data/rates.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
