<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木虾物流运费查询系统 v4.1</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 木虾物流运费查询系统</h1>
            <p>v4.1 - 修复国家选择器 (5 Sheet, 100+ 渠道)</p>
        </header>

        <main>
            <section class="search-section">
                <div class="form-group">
                    <label for="country">目的国 *</label>
                    <select id="country">
                        <option value="">请选择国家</option>
                        <!-- 国家选项将通过 JavaScript 动态加载 -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="weight">重量 (kg) *</label>
                    <input type="number" id="weight" placeholder="输入货物重量" min="0.1" step="0.1">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="serviceType">服务类型</label>
                        <select id="serviceType">
                            <option value="">全部</option>
                            <option value="快递">快递</option>
                            <option value="空运">空运</option>
                            <option value="海运">海运</option>
                            <option value="铁路">铁路</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cargoType">货物类型</label>
                        <select id="cargoType">
                            <option value="">普货</option>
                            <option value="带电">带电</option>
                            <option value="带磁">带磁</option>
                            <option value="木制品">木制品</option>
                            <option value="纺织品">纺织品</option>
                            <option value="笔类">笔类</option>
                        </select>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="searchFreight()">🔍 搜索运费</button>
                    <button class="btn btn-secondary" onclick="resetForm()">🔄 重置</button>
                    <button class="btn btn-outline" onclick="exportResults()">📤 导出</button>
                </div>
            </section>

            <section class="results-section">
                <div id="results">
                    <div class="empty-state">
                        <div class="icon">📦</div>
                        <p>请输入查询条件，点击搜索查看运费报价</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2026 木虾物流 | 数据更新：2026-04-10 14:53 | 
               <a href="https://github.com/ean-888/freight-calculator" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <!-- 数据 -->
    <script src="data/rates.js"></script>
    <!-- 主程序 -->
    <script src="js/app_v4.1.js"></script>
</body>
</html>
